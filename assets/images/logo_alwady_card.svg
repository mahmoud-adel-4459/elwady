<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="100%" height="100%">
  <!-- Card Background: Soft warm blush/dusty rose with smooth rounded corners -->
  <rect x="0" y="0" width="320" height="360" rx="48" fill="#DEB8B9" />

  <!-- Brand Elements in Deep Burgundy (#741018) -->
  <g fill="#741018" stroke="#741018">
    <!-- ================= 1. Ram / Sheep Head Emblem ================= -->
    <g transform="translate(160, 115) scale(0.95)">
      <!-- Horns: Symmetrical curved horns swirling outward and around -->
      <!-- Left Horn -->
      <path 
        d="M -16 -62 C -32 -65 -58 -55 -68 -32 C -78 -10 -74 18 -56 36 C -44 48 -28 54 -12 56 C -20 48 -24 38 -22 26 C -20 12 -8 -4 -4 -16 C -1 -28 -8 -45 -16 -62 Z" 
        stroke="none"
      />
      <!-- Right Horn -->
      <path 
        d="M 16 -62 C 32 -65 58 -55 68 -32 C 78 -10 74 18 56 36 C 44 48 28 54 12 56 C 20 48 24 38 22 26 C 20 12 8 -4 4 -16 C 1 -28 8 -45 16 -62 Z" 
        stroke="none"
      />

      <!-- Horn Inner Ridges / Lines -->
      <path d="M -48 -28 C -55 -12 -54 8 -40 22" fill="none" stroke="#DEB8B9" stroke-width="3" stroke-linecap="round" />
      <path d="M 48 -28 C 55 -12 54 8 40 22" fill="none" stroke="#DEB8B9" stroke-width="3" stroke-linecap="round" />

      <!-- Ram Ears -->
      <path d="M -36 -2 C -52 -12 -62 -4 -58 8 C -52 14 -40 10 -34 4 Z" stroke="none" />
      <path d="M 36 -2 C 52 -12 62 -4 58 8 C 52 14 40 10 34 4 Z" stroke="none" />

      <!-- Head Structure / Crown -->
      <path 
        d="M 0 -58 C -14 -58 -22 -44 -16 -30 C -12 -20 -6 -10 -6 0 L -12 16 C -14 26 -6 40 0 54 C 6 40 14 26 12 16 L 6 0 C 6 -10 12 -20 16 -30 C 22 -44 14 -58 0 -58 Z" 
        stroke="none"
      />

      <!-- Head Inner Facial Contours in Blush Color -->
      <!-- Eyes & Brow -->
      <path d="M -16 -18 C -10 -15 -4 -18 0 -22 C 4 -18 10 -15 16 -18" fill="none" stroke="#DEB8B9" stroke-width="3.5" stroke-linecap="round" />
      <!-- Left Eye -->
      <ellipse cx="-13" cy="-10" rx="3.5" ry="2" fill="#DEB8B9" stroke="none" />
      <!-- Right Eye -->
      <ellipse cx="13" cy="-10" rx="3.5" ry="2" fill="#DEB8B9" stroke="none" />
      <!-- Nose bridge & Snout -->
      <path d="M -4 -8 L -5 18 C -5 24 -1 28 0 28 C 1 28 5 24 5 18 L 4 -8" fill="none" stroke="#DEB8B9" stroke-width="3" stroke-linecap="round" />
      <!-- Nostrils / Mouth -->
      <path d="M -5 22 L 0 26 L 5 22" fill="none" stroke="#DEB8B9" stroke-width="2.5" stroke-linecap="round" />

      <!-- Collar / Shield Collar with Rivets -->
      <path 
        d="M -42 16 L -18 52 L 0 66 L 18 52 L 42 16 C 36 28 22 42 0 56 C -22 42 -36 28 -42 16 Z" 
        stroke="none"
      />
      <!-- Collar Rivets -->
      <circle cx="-30" cy="24" r="3" fill="#DEB8B9" stroke="none" />
      <circle cx="30" cy="24" r="3" fill="#DEB8B9" stroke="none" />
      <circle cx="-16" cy="44" r="3" fill="#DEB8B9" stroke="none" />
      <circle cx="16" cy="44" r="3" fill="#DEB8B9" stroke="none" />
      <circle cx="0" cy="56" r="3.5" fill="#DEB8B9" stroke="none" />
    </g>

    <!-- ================= 2. Calligraphy "الـوادي" ================= -->
    <g transform="translate(160, 240)">
      <!-- Stylized Arabic Calligraphy of "الوادي" -->
      <!-- Alif & Lam (Right vertical strokes) -->
      <path 
        d="M 52 -34 C 54 -34 56 -32 56 -28 L 56 18 C 56 22 53 25 49 25 C 45 25 42 22 42 18 L 42 -12 L 32 -12 L 32 18 C 32 24 28 27 22 27 L 12 27 C 8 27 6 24 6 20 L 6 -28 C 6 -32 8 -34 10 -34 Z" 
        stroke="none"
      />
      <!-- Waw (و) -->
      <path 
        d="M 22 -6 C 22 -18 10 -24 -2 -24 C -14 -24 -24 -16 -24 -4 C -24 8 -14 16 0 16 L 14 16 C 18 16 22 14 22 10 L 22 -6 Z M 8 -6 C 8 2 0 4 -4 4 C -8 4 -12 0 -12 -6 C -12 -12 -6 -14 -2 -14 C 4 -14 8 -10 8 -6 Z" 
        stroke="none"
      />
      <!-- Alif of Wady -->
      <path 
        d="M -22 -34 C -20 -34 -18 -32 -18 -28 L -18 18 C -18 22 -21 25 -25 25 C -29 25 -32 22 -32 18 L -32 -28 C -32 -32 -30 -34 -28 -34 Z" 
        stroke="none"
      />
      <!-- Dal & Ya (د & ي) -->
      <path 
        d="M -40 -16 C -38 -22 -44 -26 -52 -26 C -62 -26 -70 -16 -70 -4 C -70 12 -58 24 -40 26 C -26 27 -18 24 -14 18 C -12 14 -14 10 -18 10 C -22 10 -26 12 -34 14 C -48 14 -56 6 -56 -4 C -56 -12 -50 -16 -44 -16 L -40 -16 Z" 
        stroke="none"
      />
      <!-- Dots of Ya (ي) -->
      <rect x="-48" y="32" width="7" height="7" rx="1.5" transform="rotate(45 -44.5 35.5)" stroke="none" />
      <rect x="-34" y="32" width="7" height="7" rx="1.5" transform="rotate(45 -30.5 35.5)" stroke="none" />
    </g>

    <!-- ================= 3. Subtitle "—◆ للذبائح ◆—" ================= -->
    <g transform="translate(160, 310)">
      <!-- Right Line & Diamond -->
      <line x1="42" y1="0" x2="68" y2="0" stroke-width="2" stroke-linecap="round" />
      <polygon points="38,-3 42,0 38,3 34,0" stroke="none" />

      <!-- Text "للذبائح" -->
      <text 
        x="0" 
        y="5" 
        font-family="'Cairo', system-ui, sans-serif" 
        font-size="16" 
        font-weight="800" 
        text-anchor="middle" 
        fill="#741018"
        stroke="none"
        letter-spacing="0.5"
      >
        للذبائح
      </text>

      <!-- Left Line & Diamond -->
      <polygon points="-34,0 -38,-3 -42,0 -38,3" stroke="none" />
      <line x1="-42" y1="0" x2="-68" y2="0" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>

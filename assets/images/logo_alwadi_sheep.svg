<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Brand Color Definition: Supports currentColor or default pure white / dark burgundy -->
  <g fill="currentColor" stroke="none">
    <!-- ================= 1. Fluffy Sheep Graphic ================= -->
    <g id="sheep" transform="translate(250, 190)">
      <!-- Legs (Two vertical stubby legs) -->
      <rect x="-30" y="45" width="10" height="28" rx="2" />
      <rect x="40" y="45" width="10" height="28" rx="2" />

      <!-- Fluffy Cloud Body (Scalloped bumpy fleece) -->
      <path d="
        M -65 -35
        C -75 -45, -55 -70, -35 -72
        C -20 -82, 0 -85, 18 -78
        C 35 -85, 58 -76, 68 -62
        C 86 -64, 102 -48, 100 -30
        C 114 -22, 118 0, 112 15
        C 122 30, 115 50, 98 58
        C 94 72, 75 82, 60 78
        C 48 88, 25 88, 12 80
        C -2 88, -25 86, -38 75
        C -54 80, -75 70, -78 52
        C -92 42, -94 20, -84 5
        C -96 -10, -88 -32, -65 -35 Z
      " />

      <!-- Head & Face (Tilted slightly to the left) -->
      <g transform="translate(-62, -22) rotate(-10)">
        <!-- Oval/Rounded Head base with neck cutout -->
        <path d="
          M -32 -6
          C -38 -22, -10 -36, 12 -34
          C 32 -32, 42 -14, 38 6
          C 34 26, 8 36, -14 30
          C -30 24, -36 10, -32 -6 Z
        " />

        <!-- Fluffy Wool Tuft on Top of the Head -->
        <path d="
          M -12 -32
          C -20 -40, -6 -48, 4 -44
          C 14 -48, 24 -38, 20 -30
          C 12 -28, -2 -28, -12 -32 Z
        " />

        <!-- Left Drooping Ear -->
        <path d="
          M -28 -14
          C -48 -22, -64 -10, -56 4
          C -48 14, -32 6, -24 -2 Z
        " />

        <!-- Right Ear -->
        <path d="
          M 26 -16
          C 44 -20, 56 -10, 52 4
          C 44 12, 32 4, 24 -4 Z
        " />

        <!-- Smiling Happy Eyes (Carved out with mask or contrasting color) -->
        <!-- We use an inner cut with stroke matching background -->
        <path d="M -16 2 C -16 -6, -4 -6, -4 2" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 4 3 C 4 -5, 16 -5, 16 3" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- ================= 2. Arabic Wordmark "الـوادي" ================= -->
    <g id="arabic-wordmark" transform="translate(250, 315)">
      <!-- Custom Calligraphy matching the user's logo -->
      <!-- ا (Alif right) -->
      <path d="M 100 -40 L 100 24 C 100 32, 94 36, 88 36 L 82 36 C 76 36, 72 32, 72 24 L 72 -40 Z" />
      
      <!-- ل (Lam) -->
      <path d="M 70 -40 L 70 15 C 70 28, 55 35, 40 35 L 20 35 C 10 35, 6 28, 6 20 L 6 -40 L 22 -40 L 22 18 L 54 18 L 54 -40 Z" />

      <!-- و (Waw) -->
      <path d="
        M 18 -6
        C 18 -24, 0 -30, -18 -30
        C -36 -30, -48 -18, -48 -2
        C -48 16, -32 32, -8 32
        L 8 32
        C 16 32, 18 24, 18 16
        Z
        M -2 -8
        C -2 4, -12 14, -20 14
        C -28 14, -32 6, -32 -2
        C -32 -10, -26 -16, -18 -16
        C -10 -16, -2 -12, -2 -8
        Z
      " />

      <!-- ا (Alif of Wady) -->
      <path d="M -22 -40 L -22 24 C -22 32, -28 36, -34 36 L -40 36 C -46 36, -50 32, -50 24 L -50 -40 Z" />

      <!-- د (Dal) & ي (Ya) connected flourish -->
      <path d="
        M -56 -18
        C -54 -28, -65 -32, -78 -32
        C -96 -32, -108 -16, -108 4
        C -108 26, -88 42, -58 44
        C -38 45, -26 40, -18 32
        C -14 26, -18 20, -24 20
        C -30 20, -36 24, -48 26
        C -70 26, -86 16, -86 -2
        C -86 -14, -76 -18, -68 -18
        Z
      " />

      <!-- Two Diamond Dots under the Ya (ي) -->
      <rect x="-82" y="52" width="11" height="11" rx="2" transform="rotate(45 -76.5 57.5)" />
      <rect x="-60" y="52" width="11" height="11" rx="2" transform="rotate(45 -54.5 57.5)" />
    </g>

    <!-- ================= 3. Subtitle "— Al wadi —" ================= -->
    <g id="english-subtitle" transform="translate(250, 405)" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
      <!-- Right Divider Line -->
      <line x1="60" y1="-4" x2="95" y2="-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />

      <!-- Text "Al wadi" -->
      <text 
        x="0" 
        y="0" 
        font-size="16" 
        font-weight="500" 
        letter-spacing="4" 
        fill="currentColor"
      >
        Al wadi
      </text>

      <!-- Left Divider Line -->
      <line x1="-95" y1="-4" x2="-60" y2="-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>
</svg>

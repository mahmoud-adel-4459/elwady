name: alwady_app
description: "الوادي للذبائح - Al-Wady Butchery & Fresh Meats"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: 0.14.3
  image: 4.12.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/launcher_icon.png
  background_color: '#FFFFFF'
  adaptive_icon_background: '#741018'
  adaptive_icon_foreground: assets/images/logo_alwadi_transparent_white.png
  adaptive_icon_foreground_inset: 20
  adaptive_icon_monochrome: assets/images/logo_alwadi_transparent_white.png
  min_sdk_android: 21

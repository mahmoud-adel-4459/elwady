<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة تصميم الوادي</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f5f5;color:#211d1d}header{padding:20px;background:white;border-bottom:1px solid #e5dddd;position:sticky;top:0;z-index:2}h1{font-size:22px;margin:0 0 12px}p{font-size:14px;line-height:1.6;margin:8px 0}select,button{padding:10px;border:1px solid #d9cccc;border-radius:8px;background:white;font-size:15px}main{display:flex;justify-content:center;align-items:start;gap:20px;padding:20px;direction:ltr;flex-wrap:wrap}figure{margin:0;width:min(390px,100%)}figcaption{text-align:center;font-weight:bold;margin:10px}img{width:100%;border-radius:14px;background:white;box-shadow:0 5px 20px #0001}.missing{height:200px;display:grid;place-items:center;background:white;direction:rtl}.note{color:#777;font-size:13px}</style><header><h1>مراجعة تصميم الوادي: React وFlutter</h1><select id="screen"></select> <button id="previous">السابق</button> <button id="next">التالي</button> <label><input id="bottom" type="checkbox"> نهاية التمرير في Flutter</label><p>نفس مساحة العرض: 390 × 844. 31 حالة لها صور من المشروعين.</p><p class="note">صور Flutter مأخوذة من اختبارات الواجهات، وصور React من Chrome. الإيموجي وشكل بعض الأيقونات والحركات يتأثرون بالمنصة. هذه مراجعة بصرية وليست شهادة تطابق كل بكسل أو اختبار APK على جهاز.</p></header><main><figure><figcaption>React — المرجع</figcaption><div id="react"></div></figure><figure><figcaption>Flutter — التنفيذ</figcaption><div id="flutter"></div></figure></main><script>const data=[{"id":"splash-cleavers","label":"السبلش: المرحلة الأولى","react":true,"flutter":true,"bottom":false},{"id":"splash-logo","label":"السبلش: اللوجو","react":true,"flutter":true,"bottom":false},{"id":"onboarding-1","label":"التعريف ١","react":true,"flutter":true,"bottom":false},{"id":"onboarding-2","label":"التعريف ٢","react":true,"flutter":true,"bottom":false},{"id":"onboarding-3","label":"التعريف ٣","react":true,"flutter":true,"bottom":false},{"id":"login","label":"الدخول","react":true,"flutter":true,"bottom":false},{"id":"otp","label":"رمز التحقق","react":true,"flutter":true,"bottom":false},{"id":"profile-setup","label":"تسجيل العميل","react":true,"flutter":true,"bottom":true},{"id":"countries","label":"اختيار الدولة","react":true,"flutter":true,"bottom":false},{"id":"location-permission","label":"إذن الموقع","react":true,"flutter":true,"bottom":false},{"id":"home","label":"الرئيسية","react":true,"flutter":true,"bottom":true},{"id":"categories","label":"الأقسام","react":true,"flutter":true,"bottom":true},{"id":"category-listing","label":"قائمة القسم","react":true,"flutter":true,"bottom":true},{"id":"search-results","label":"البحث","react":true,"flutter":true,"bottom":false},{"id":"product-details","label":"تفاصيل القطعية","react":true,"flutter":true,"bottom":true},{"id":"carcass-details","label":"تفاصيل الذبيحة","react":true,"flutter":true,"bottom":true},{"id":"cart","label":"السلة","react":true,"flutter":true,"bottom":true},{"id":"cart-empty","label":"السلة الفارغة","react":true,"flutter":true,"bottom":true},{"id":"checkout","label":"الدفع","react":true,"flutter":true,"bottom":true},{"id":"thank-you","label":"تأكيد الطلب","react":true,"flutter":true,"bottom":false},{"id":"orders-current","label":"الطلبات الحالية","react":true,"flutter":true,"bottom":true},{"id":"orders-previous","label":"الطلبات السابقة","react":true,"flutter":true,"bottom":true},{"id":"order-tracking","label":"تتبّع الطلب","react":true,"flutter":true,"bottom":true},{"id":"profile","label":"الحساب","react":true,"flutter":true,"bottom":true},{"id":"personal-info","label":"البيانات الشخصية","react":true,"flutter":true,"bottom":false},{"id":"addresses","label":"العناوين","react":true,"flutter":true,"bottom":true},{"id":"location-picker","label":"اختيار الموقع","react":true,"flutter":true,"bottom":false},{"id":"favorites","label":"المفضلة","react":true,"flutter":true,"bottom":false},{"id":"notifications","label":"الإشعارات","react":true,"flutter":true,"bottom":true},{"id":"weight-adjustment","label":"تعديل الوزن","react":true,"flutter":true,"bottom":true},{"id":"location-guard","label":"تأكيد تغيير العنوان","react":true,"flutter":true,"bottom":true}];const select=document.querySelector('#screen');data.forEach((d,i)=>select.add(new Option(d.label,i)));function render(){const d=data[+select.value];const bottom=document.querySelector('#bottom');bottom.disabled=!d.bottom;for(const kind of ['react','flutter']){const suffix=kind==='flutter'&&bottom.checked&&d.bottom?'-bottom':'';document.getElementById(kind).innerHTML=d[kind]?'<a href="'+kind+'/'+d.id+suffix+'.png" target="_blank"><img src="'+kind+'/'+d.id+suffix+'.png" alt="'+d.label+'"></a>':'<div class="missing">لم يتم تسجيل صورة لهذه الحالة</div>';}}select.onchange=render;document.querySelector('#bottom').onchange=render;document.querySelector('#next').onclick=()=>{select.value=(+select.value+1)%data.length;render()};document.querySelector('#previous').onclick=()=>{select.value=(+select.value+data.length-1)%data.length;render()};render();</script></html>

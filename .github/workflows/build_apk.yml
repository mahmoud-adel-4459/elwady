name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Regenerate Android Skeleton & Build Official Release APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            TARGET_DIR="."
          elif [ -d "alwady_flutter" ]; then
            TARGET_DIR="./alwady_flutter"
          fi
          
          cd $TARGET_DIR
          rm -rf android
          flutter create . --platforms=android --org=com.alwady --project-name=alwady_app
          
          # Set internet permission and Arabic title
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="alwady_app"/android:label="الوادي للذبائح"/' android/app/src/main/AndroidManifest.xml

          # Generate official Release Keystore
          keytool -genkey -v -keystore android/app/release.jks -alias alwady -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass alwady2026 -keypass alwady2026 \
            -dname "CN=Al-Wady Butchery, OU=Development, O=Al-Wady, L=Riyadh, ST=Riyadh, C=SA"

          # Configure release signing in android/app/build.gradle
          node -e "
            const fs = require('fs');
            const file = 'android/app/build.gradle';
            let s = fs.readFileSync(file, 'utf8');
            const signing = '\n    signingConfigs {\n        release {\n            keyAlias \"alwady\"\n            keyPassword \"alwady2026\"\n            storeFile file(\"release.jks\")\n            storePassword \"alwady2026\"\n        }\n    }\n';
            s = s.replace('buildTypes {', signing + '    buildTypes {');
            s = s.replace(/signingConfig\s*=?\s*signingConfigs\.debug/g, 'signingConfig = signingConfigs.release');
            fs.writeFileSync(file, s);
          "
          
          flutter pub get
          dart run tool/prepare_launcher_icon.dart
          dart run flutter_launcher_icons
          dart run tool/prepare_native_launch.dart
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/apk_output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/apk_output/alwady-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alwady-release-apk
          path: apk_output/alwady-release.apk
          retention-days: 14

name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Regenerate Android Skeleton & Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            TARGET_DIR="."
          elif [ -d "alwady_flutter" ]; then
            TARGET_DIR="./alwady_flutter"
          fi
          
          cd $TARGET_DIR
          rm -rf android
          flutter create . --platforms=android --org=com.alwady --project-name=alwady_app
          
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="alwady_app"/android:label="الوادي للذبائح"/' android/app/src/main/AndroidManifest.xml
          
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/apk_output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/apk_output/alwady-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alwady-release-apk
          path: apk_output/alwady-release.apk
          retention-days: 14
